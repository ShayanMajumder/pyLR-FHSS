[build-system]
requires = ["setuptools>=77", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "lrfhss"
version = "1.0.0"
description = "Blind LR-FHSS receiver and encoder: detects, synchronises and decodes LR-FHSS packets from raw IQ"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shayan Majumder", email = "shayan.majumder2@gmail.com" },
]
keywords = ["LR-FHSS", "LoRa", "LoRaWAN", "SDR", "satellite IoT", "physical layer", "receiver"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
]

[project.optional-dependencies]
# Only needed for plot_packet_spectrogram(); imported lazily so a decode
# never pays matplotlib's ~320 ms import.
plots = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ShayanMajumder/LR-FHSS"
Source = "https://github.com/ShayanMajumder/LR-FHSS"
Issues = "https://github.com/ShayanMajumder/LR-FHSS/issues"
Changelog = "https://github.com/ShayanMajumder/LR-FHSS/blob/main/CHANGELOG.md"

[tool.setuptools]
# The compiled core is built into the package as lrfhss._viterbi_ext, so
# `import lrfhss` works from anywhere once installed. It used to be a
# top-level lrfhss_viterbi_ext.so that had to sit on sys.path beside the
# package, which is why the examples needed a sys.path bootstrap.
packages = ["lrfhss", "lrfhss.phy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# CPython 3.10+ (from requires-python). 32-bit and musl targets have no
# scipy wheels to test against, and free-threaded builds are not supported
# yet; those platforms still install from the sdist on the numpy fallback.
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_*", "cp3??t-*"]
# A wheel without the compiled core would silently run several times
# slower, so a failed compile must fail the wheel build.
environment = { LRFHSS_REQUIRE_EXT = "1" }
test-requires = ["pytest"]
test-command = [
    "python -c \"import lrfhss, sys; sys.exit(not lrfhss.config._HAVE_VEXT_LOCAL)\"",
    "pytest {project}/tests -q",
]
# numpy and scipy do not publish wheels for a CPython release candidate
# early enough to test against; the 3.15 wheels are still built.
test-skip = ["cp315-*"]
